<section class="chiffres-section">
  <div class="section-header">
    <span class="section-label">Chiffres clés</span>
    <div class="section-line-center"></div>
    <h2>Attijari Bank en chiffres</h2>
    <p class="section-desc">Une banque solide, proche de vous</p>
  </div>

  <div class="chiffres-grid" *ngIf="!loading; else skeleton">
    <article class="chiffre-card" *ngFor="let c of chiffres; let i = index">
     
      <p class="chiffre-value">{{ c.valeur }}</p>
      <p class="chiffre-label">{{ c.libelle }}</p>
    </article>
  </div>

  <ng-template #skeleton>
    <div class="chiffres-grid">
      <div class="skeleton-card" *ngFor="let i of [1,2,3,4]"></div>
    </div>
  </ng-template>
</section>
