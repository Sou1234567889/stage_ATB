<section class="valeurs-section">
  <div class="section-header">
    <span class="section-label">Nos piliers</span>
    <div class="section-line-center"></div>
    <h2>Nos valeurs</h2>
    <p class="section-desc">Ce qui nous guide au quotidien</p>
  </div>

  <div class="valeurs-grid" *ngIf="!loading; else skeleton">
    <article class="valeur-card" *ngFor="let v of valeurs; let i = index">
     
      <h3>{{ v.titre }}</h3>
      <p>{{ v.description }}</p>
    </article>
  </div>

  <ng-template #skeleton>
    <div class="valeurs-grid">
      <div class="skeleton-card" *ngFor="let i of [1,2,3,4]"></div>
    </div>
  </ng-template>
</section>
